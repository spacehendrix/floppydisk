[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "floppydisk"
version = "1.0.0"
description = "A DaisyDisk-style disk usage scanner and cleaner for the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["disk", "usage", "tui", "curses", "daisydisk", "du"]

[project.scripts]
floppydisk = "floppydisk.__main__:main"

[tool.setuptools]
packages = ["floppydisk"]
